# Phase 27 -- start the whole system with:
#   docker compose -f docker/docker-compose.yml up --build
#
# Backend: http://localhost:8000  (docs at /docs)
# Frontend: http://localhost:3000

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ailab
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/ailab
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Creates tables on first boot (idempotent -- CREATE TABLE IF NOT
    # EXISTS-equivalent via SQLAlchemy's create_all) before starting the
    # API server. A real deployment would use Alembic migrations instead
    # (noted as a known limitation -- see Phase 16's docstring); this is
    # sufficient for "startable with a single command."
    command: >
      sh -c "python -c 'from app.database.session import engine, init_db; init_db(engine)' &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
